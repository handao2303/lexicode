    <script>
      // Apply the saved theme (light by default) before first paint.
      (function () {
        var t = "light";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
